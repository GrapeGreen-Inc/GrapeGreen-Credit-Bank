<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrapeGreen Credit - Login</title>
<script src="https://cloudflare.com"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{margin:0;display:flex;min-height:100vh;background:#f3eff7}.left{flex:1;background:linear-gradient(135deg,#3b1763,#1e8267);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:3rem}.left h1{font-size:2.8rem;margin:0 0 .5rem}.left span{color:#8be04e}.right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}.box{background:#fff;padding:2.5rem;border-radius:16px;width:100%;max-width:400px;box-shadow:0 8px 24px rgba(0,0,0,.08)}label{display:block;font-weight:600;margin-top:1rem;margin-bottom:.35rem;color:#222}input{width:100%;padding:.75rem;border:1px solid #ccc;border-radius:8px;font-size:1rem}button{width:100%;margin-top:1.5rem;padding:.85rem;background:#3b1763;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#4e2082}#err{color:#d93025;margin-top:1rem;font-size:.85rem;font-weight:600;word-break:break-word}
</style>
</head>
<body>
<div class="left">
<h1>Grape<span>Green</span> Credit</h1>
<p>Manage your balance, view card details, track external payments, and send token transfers.</p>
</div>
<div class="right">
<div class="box">
<h2 style="margin-top:0">Sign In with Card</h2>
<label>Username</label>
<input id="u-in" type="text" placeholder="MattyGrapeGreenOwner" autocomplete="off">
<label>Card Number</label>
<input id="num-in" type="text" placeholder="XXXX-0000-0000-0000" autocomplete="off">
<label>Security Code (CVC)</label>
<input id="cvc-in" type="password" maxlength="3" placeholder="•••">
<button id="login-btn">Access Credit Account</button>
<div id="err"></div>
</div>
</div>
<script>(()=>{const P="app-iguess-39f2f",K="AIzaSyAqy6NWFJ1KD9Cfv_WyqbMJJWCqlC5P7Es",B=`https://googleapis.com{P}/databases/(default)/documents`,S=`GrapeGreen_AES256_${P}_VaultKey`,dec=c=>{if(!c||typeof c!=="string"||typeof CryptoJS==="undefined")return"";try{return CryptoJS.AES.decrypt(c,S).toString(CryptoJS.enc.Utf8)}catch{return""}},prs=d=>{const o={},f=d.fields||{};for(const[k,v]of Object.entries(f)){if("stringValue"in v)o[k]=v.stringValue;else if("integerValue"in v)o[k]=Number(v.integerValue);else if("doubleValue"in v)o[k]=Number(v.doubleValue);else if("booleanValue"in v)o[k]=Boolean(v.booleanValue)}return o};document.getElementById("login-btn").addEventListener("click",async()=>{const e=document.getElementById("err"),u=document.getElementById("u-in").value.trim(),n=document.getElementById("num-in").value.trim().toUpperCase(),c=document.getElementById("cvc-in").value.trim();e.textContent="";if(!u||!n||!c){e.textContent="Please fill in all fields.";return}e.style.color="#3b1763";e.textContent="Verifying...";const url=`${B}/users/${encodeURIComponent(u)}?key=${K}`;try{const r=await fetch(url);if(!r.ok){const txt=await r.text();throw new Error(`HTTP ${r.status}: ${txt.slice(0,120)}`)}if(typeof CryptoJS==="undefined")throw new Error("CryptoJS not loaded");const usr=prs(await r.json()),rc=dec(usr.Card_Num).toUpperCase(),rv=dec(usr.Card_Code);if(!rc||rc!==n)throw new Error("Invalid card number.");if(!rv||rv!==c)throw new Error("Invalid CVC code.");const t=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();sessionStorage.setItem("gg_credit_session",JSON.stringify({username:u,token:t,lastActive:Date.now()}));window.location.href=`../users/?u=${encodeURIComponent(u)}&token=${encodeURIComponent(t)}`}catch(x){e.style.color="#d93025";e.textContent=`${x.name}: ${x.message} | URL: ${url}`}})})();</script>
