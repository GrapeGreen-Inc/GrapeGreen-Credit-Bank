<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrapeGreen Credit - Login</title>
<script src="https://cloudflare.com"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{margin:0;display:flex;min-height:100vh;background:#f3eff7}.left{flex:1;background:linear-gradient(135deg,#3b1763,#1e8267);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:3rem}.left h1{font-size:2.8rem;margin:0 0 .5rem}.left span{color:#8be04e}.right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}.box{background:#fff;padding:2.5rem;border-radius:16px;width:100%;max-width:400px;box-shadow:0 8px 24px rgba(0,0,0,.08)}label{display:block;font-weight:600;margin-top:1rem;margin-bottom:.35rem;color:#222}input{width:100%;padding:.75rem;border:1px solid #ccc;border-radius:8px;font-size:1rem}button{width:100%;margin-top:1.5rem;padding:.85rem;background:#3b1763;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#4e2082}#err{color:#d93025;margin-top:1rem;font-size:.85rem;font-weight:600;word-break:break-word}
</style>
</head>
<body>
<div class="left">
<h1>Grape<span>Green</span> Credit</h1>
<p>Manage your balance, view card details, track external payments, and send token transfers.</p>
</div>
<div class="right">
<div class="box">
<h2 style="margin-top:0">Sign In with Card</h2>
<label>Username</label>
<input id="u-in" type="text" placeholder="MattyGrapeGreenOwner" autocomplete="off">
<label>Card Number</label>
<input id="num-in" type="text" placeholder="XXXX-0000-0000-0000" autocomplete="off">
<label>Security Code (CVC)</label>
<input id="cvc-in" type="password" maxlength="3" placeholder="•••">
<button id="login-btn">Access Credit Account</button>
<div id="err"></div>
</div>
</div>
<script>
(function () {
  const PROJECT_ID = "app-iguess-39f2f";
  const API_KEY = "AIzaSyAqy6NWFJ1KD9Cfv_WyqbMJJWCqlC5P7Es";
  const BASE_DB = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";
  const AES_SECRET = "GrapeGreen_AES256_" + PROJECT_ID + "_VaultKey";

  function decryptAES256(cipherText) {
    if (!cipherText || typeof cipherText !== "string" || typeof CryptoJS === "undefined") {
      return "";
    }
    try {
      return CryptoJS.AES.decrypt(cipherText, AES_SECRET).toString(CryptoJS.enc.Utf8);
    } catch (e) {
      return "";
    }
  }

  function parseDoc(doc) {
    const obj = {};
    const fields = doc.fields || {};
    for (const [key, val] of Object.entries(fields)) {
      if ("stringValue" in val) obj[key] = val.stringValue;
      else if ("integerValue" in val) obj[key] = Number(val.integerValue);
      else if ("doubleValue" in val) obj[key] = Number(val.doubleValue);
      else if ("booleanValue" in val) obj[key] = Boolean(val.booleanValue);
    }
    return obj;
  }

  document.getElementById("login-btn").addEventListener("click", async function () {
    const errEl = document.getElementById("err");
    const username = document.getElementById("u-in").value.trim();
    const cardNum = document.getElementById("num-in").value.trim().toUpperCase();
    const cvc = document.getElementById("cvc-in").value.trim();

    errEl.textContent = "";
    if (!username || !cardNum || !cvc) {
      errEl.textContent = "Please fill in all fields.";
      return;
    }

    errEl.style.color = "#3b1763";
    errEl.textContent = "Verifying...";

    const url = BASE_DB + "/users/" + encodeURIComponent(username) + "?key=" + API_KEY;

    try {
      const response = await fetch(url);
      if (!response.ok) {
        if (response.status === 404) throw new Error("Account not found.");
        throw new Error("HTTP " + response.status);
      }

      const user = parseDoc(await response.json());
      const realCard = decryptAES256(user.Card_Num).toUpperCase();
      const realCvc = decryptAES256(user.Card_Code);

      if (!realCard || realCard !== cardNum) throw new Error("Invalid card number.");
      if (!realCvc || realCvc !== cvc) throw new Error("Invalid CVC code.");

      const sessionToken = crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(36).slice(2) + Date.now();

      sessionStorage.setItem("gg_credit_session", JSON.stringify({
        username: username,
        token: sessionToken,
        lastActive: Date.now()
      }));

      window.location.href = "../users/?u=" + encodeURIComponent(username) + "&token=" + encodeURIComponent(sessionToken);
    } catch (err) {
      errEl.style.color = "#d93025";
      errEl.textContent = err.message;
    }
  });
})();
</script>
</body>
</html>
